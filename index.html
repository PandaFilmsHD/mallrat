<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mallrat</title>
<meta name="theme-color" content="#060a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mallrat">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#060a12; --panel:rgba(20,30,46,.62); --panel2:rgba(28,40,60,.7); --line:rgba(143,208,255,.14);
    --text:#eef6ff; --dim:#8ea3bb; --accent:#8fd0ff; --accent2:#4fa8e0; --glow:rgba(110,190,255,.45); --bad:#ff8a8a;
    --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding-bottom:calc(30px + var(--safe-bot));overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
    background:radial-gradient(40% 35% at 15% 10%,rgba(79,168,224,.42),transparent 70%),
               radial-gradient(35% 30% at 90% 20%,rgba(143,208,255,.26),transparent 70%),
               radial-gradient(45% 40% at 60% 95%,rgba(60,110,220,.32),transparent 70%);
    animation:drift 18s ease-in-out infinite alternate}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
  @keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  svg{display:block}
  .wrap{max-width:1180px;margin:0 auto}
  header{position:sticky;top:0;z-index:10;background:rgba(6,10,18,.62);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
    padding:calc(10px + var(--safe-top)) 14px 10px;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{font-weight:900;font-size:26px;letter-spacing:-1px;display:flex;align-items:center;gap:8px;
    background:linear-gradient(90deg,#ffffff,#8fd0ff,#4fa8e0,#ffffff);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
  .logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--glow),0 0 24px var(--glow)}
  @keyframes shine{to{background-position:300% 0}}
  .iconbtn{width:40px;height:40px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;transition:.15s}
  .iconbtn:first-of-type{margin-left:auto}
  .iconbtn svg{width:19px;height:19px;stroke:var(--text)}
  form{display:flex;gap:8px;position:relative}
  .searchbox{flex:1;min-width:0;position:relative}
  .searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--dim);pointer-events:none}
  input[type=search],input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:16px;padding:13px 14px;font-size:16px;outline:none;transition:.2s}
  input[type=search]{padding-left:42px}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(143,208,255,.12),0 0 24px rgba(143,208,255,.15)}
  input::placeholder{color:#5f7590}
  .go{background:linear-gradient(135deg,#bfe6ff,#8fd0ff 45%,#4fa8e0);color:#04182b;font-weight:800;border-radius:16px;padding:0 20px;
    box-shadow:0 6px 22px rgba(79,168,224,.35);transition:.15s}
  .go:active{transform:scale(.96)}
  .storebar{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent)}
  .storebar::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--dim);white-space:nowrap;transition:.15s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:linear-gradient(135deg,rgba(143,208,255,.22),rgba(79,168,224,.12));border-color:rgba(143,208,255,.55);color:#fff;box-shadow:0 0 14px rgba(143,208,255,.14)}
  .chip.on::before{content:"✓ ";color:var(--accent);font-weight:700}
  .chip.meta{color:var(--accent);border-style:dashed}
  main{padding:14px 14px 0}
  .status{color:var(--dim);font-size:13px;margin:2px 2px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .status b{color:var(--accent);font-size:15px}
  .filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters .chip{font-size:13px;padding:6px 11px}
  .filters .chip.on::before{content:""}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{position:relative;display:block;border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid var(--line);
    background:var(--panel);aspect-ratio:3/4.2;transition:transform .2s ease,box-shadow .2s ease,border-color .2s;animation:pop .35s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
  .card:active{transform:scale(.97)}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#0e1622}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,18,0) 50%,rgba(6,10,18,.92) 100%);pointer-events:none}
  .badge{position:absolute;z-index:2;left:8px;top:8px;background:rgba(6,10,18,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}
  .heart{position:absolute;z-index:2;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(6,10,18,.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;transition:.15s}
  .heart svg{width:16px;height:16px;stroke:#fff;fill:none}
  .heart.on svg{fill:var(--accent);stroke:var(--accent);filter:drop-shadow(0 0 6px var(--glow))}
  .heart:active{transform:scale(.85)}
  .meta2{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:10px 11px 11px;font-size:13px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .open{position:absolute;z-index:2;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);display:none;place-items:center}
  .skel{aspect-ratio:3/4.2;border-radius:20px;border:1px solid var(--line);
    background:linear-gradient(100deg,rgba(20,30,46,.6) 30%,rgba(60,90,130,.35) 50%,rgba(20,30,46,.6) 70%);background-size:250% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-250% 0}}
  .empty{text-align:center;color:var(--dim);padding:34px 20px;line-height:1.55}
  .empty b{color:var(--text)}
  .hero{text-align:center;padding:44px 16px 20px}
  .hero .orb{width:92px;height:92px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(143,208,255,.25),rgba(79,168,224,.08));border:1px solid rgba(143,208,255,.35);
    box-shadow:0 0 40px rgba(143,208,255,.2),inset 0 0 20px rgba(143,208,255,.1);animation:float 4s ease-in-out infinite}
  .hero .orb svg{width:42px;height:42px;stroke:var(--accent)}
  @keyframes float{50%{transform:translateY(-8px)}}
  .hero h1{margin:0 0 8px;font-size:26px;letter-spacing:-.6px}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--dim);margin:0 auto;max-width:340px;line-height:1.5;font-size:15px}
  .tips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .tips button{padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:14px}
  .hint{margin-top:22px;font-size:13px;color:#6f86a1}
  .more{display:block;margin:20px auto 0;background:var(--panel2);border:1px solid var(--line);padding:13px 24px;border-radius:16px;font-weight:600}
  .fallback{display:grid;gap:8px;margin-top:10px}
  .fallback a{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:14px;color:var(--text);text-decoration:none}
  .fallback a span{color:var(--accent)}
  details summary{cursor:pointer}
  .sheet{position:fixed;inset:0;background:rgba(2,5,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;z-index:50;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheetbox{background:rgba(14,22,34,.96);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(22px + var(--safe-bot));max-height:88vh;overflow:auto;
    border:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .sheetbox h2{margin:0 0 6px;font-size:20px}
  .sheetbox p{color:var(--dim);font-size:14px;line-height:1.45;margin:6px 0 12px}
  .sheetbox a{color:var(--accent)}
  .row{display:flex;gap:8px;margin:8px 0}
  .btn{background:var(--panel2);border:1px solid var(--line);padding:11px 14px;border-radius:12px}
  .btn.primary{background:linear-gradient(135deg,#bfe6ff,#8fd0ff 45%,#4fa8e0);color:#04182b;font-weight:800;border:0}
  .storelist{display:grid;gap:6px;margin:8px 0 14px}
  .storeitem{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:10px 12px;border-radius:12px;font-size:14px;border:1px solid var(--line)}
  .storeitem small{color:var(--dim);margin-left:auto}
  .x{color:var(--bad);padding:2px 6px}
  .err{color:var(--bad)}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  @media(hover:hover){
    .card:hover{transform:translateY(-4px);border-color:rgba(143,208,255,.5);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 30px rgba(143,208,255,.12)}
    .card:hover .open{display:grid}
    .chip:hover,.iconbtn:hover{border-color:rgba(143,208,255,.5)}
    .go:hover{filter:brightness(1.08);box-shadow:0 8px 30px rgba(79,168,224,.5)}
  }
  @media(min-width:700px){
    header{padding:18px 0 14px} header .wrap{padding:0 24px}
    main{padding:20px 24px 0}
    .storebar,.filters{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none}
    .grid{grid-template-columns:repeat(3,1fr);gap:16px}
    .meta2{font-size:14px}
    .sheet{align-items:center}
    .sheetbox{border-radius:26px;max-height:80vh}
    form{max-width:760px}
    .hero{padding-top:80px}.hero h1{font-size:38px}
  }
  @media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:1250px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header>
<div class="wrap">
  <div class="top">
    <div class="logo"><i></i>mallrat</div>
    <button class="iconbtn" id="favBtn" title="Saved"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
    <button class="iconbtn" id="setBtn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <form id="f">
    <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="white tube top…" autocomplete="off" enterkeyhint="search"></div>
    <button class="go" type="submit">Search</button>
  </form>
  <div class="storebar" id="storebar"></div>
</div>
</header>

<main class="wrap">
  <div class="status" id="status"></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div id="below"></div>
</main>

<div class="sheet" id="sheet"><div class="sheetbox" id="sheetbox"></div></div>

<script>
const DEFAULT_STORES = [
  {id:'aritzia', name:'Aritzia', domain:'aritzia.com', url:'https://www.aritzia.com/us/en/search?q='},
  {id:'freepeople', name:'Free People', domain:'freepeople.com', url:'https://www.freepeople.com/search/?q='},
  {id:'lulu', name:'Lululemon', domain:'lululemon.com', url:'https://shop.lululemon.com/search?Ntt='},
  {id:'alo', name:'Alo', domain:'aloyoga.com', url:'https://www.aloyoga.com/search?q='},
  {id:'brandy', name:'Brandy Melville', domain:'brandymelville.com', url:'https://us.brandymelville.com/search?q='},
  {id:'polly', name:'Princess Polly', domain:'princesspolly.com', url:'https://us.princesspolly.com/search?q='},
  {id:'skims', name:'Skims', domain:'skims.com', url:'https://skims.com/search?q='},
  {id:'zara', name:'Zara', domain:'zara.com', url:'https://www.zara.com/us/en/search?searchTerm='},
  {id:'af', name:'Abercrombie', domain:'abercrombie.com', url:'https://www.abercrombie.com/shop/us/search?searchTerm='},
  {id:'anthro', name:'Anthropologie', domain:'anthropologie.com', url:'https://www.anthropologie.com/search?q='},
  {id:'dd', name:'Daily Drills', domain:'shopdailydrills.com', url:'https://shopdailydrills.com/search?q='},
];

const HEART=`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`, ARROW=`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#04182b" stroke-width="2.6" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>`;
const $ = s => document.querySelector(s);
const ls = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

// key can be passed once as #key=xxxx (so you can text someone a setup link)
(function(){
  const m = location.hash.match(/key=([^&]+)/);
  if(m){ ls.set('apiKey', decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname+location.search); }
})();

let stores = ls.get('stores', DEFAULT_STORES);
let selected = new Set(ls.get('selected', stores.map(s=>s.id)));
let favs = ls.get('favs', []);
let state = {q:'', page:1, results:[], filter:'all', perStore:{}, errors:{}, loading:false};

function storeById(id){return stores.find(s=>s.id===id)}

function renderStoreBar(){
  const bar = $('#storebar'); bar.innerHTML='';
  const all = document.createElement('button');
  const allOn = selected.size===stores.length;
  all.className='chip meta'; all.textContent = allOn ? 'Clear all' : 'Select all';
  all.onclick=()=>{ selected = allOn ? new Set() : new Set(stores.map(s=>s.id)); save(); renderStoreBar(); };
  bar.appendChild(all);
  stores.forEach(s=>{
    const b=document.createElement('button');
    b.className='chip'+(selected.has(s.id)?' on':''); b.textContent=s.name;
    b.onclick=()=>{ selected.has(s.id)?selected.delete(s.id):selected.add(s.id); save(); renderStoreBar(); };
    bar.appendChild(b);
  });
}
function save(){ ls.set('selected',[...selected]); ls.set('stores',stores); ls.set('favs',favs); }

// ---------- search ----------
const NON_PRODUCT = /(\/blogs?\/|\/pages\/|\/search|\/stores?\/|\/help|\/careers|instagram|pinterest|\/c\/[^/]*$)/i;

async function searchStore(store, q, page, key){
  const cacheKey = `c:${store.domain}:${q.toLowerCase()}:${page}`;
  const cached = sessionStorage.getItem(cacheKey);
  if(cached) return JSON.parse(cached);
  const res = await fetch('https://google.serper.dev/images',{
    method:'POST',
    headers:{'X-API-KEY':key,'Content-Type':'application/json'},
    body:JSON.stringify({q:`${q} site:${store.domain}`, gl:'us', hl:'en', num:10, page})
  });
  if(!res.ok){
    let msg = res.status===401||res.status===403 ? 'API key not working' : res.status===400 ? 'Out of credits or bad request' : 'Error '+res.status;
    throw new Error(msg);
  }
  const data = await res.json();
  if(data.credits!=null) ls.set('creditsUsedLast', data.credits);
  const seen = new Set();
  const items = (data.images||[]).filter(it=>{
    if(!it.link || !it.imageUrl) return false;
    if(!it.link.includes(store.domain.split('.')[0])) return false;
    if(NON_PRODUCT.test(it.link)) return false;
    const k = it.link.split('?')[0];
    if(seen.has(k)) return false; seen.add(k); return true;
  }).map(it=>({
    store:store.id, title:cleanTitle(it.title, store), link:it.link,
    img:it.imageUrl, thumb:it.thumbnailUrl
  }));
  try{sessionStorage.setItem(cacheKey, JSON.stringify(items))}catch(e){}
  return items;
}
function cleanTitle(t, store){
  if(!t) return store.name;
  return t.replace(new RegExp('\\s*[|\\-–—]\\s*'+store.name.split(' ')[0]+'.*$','i'),'')
          .replace(/\s*[|]\s*.*$/,'').trim() || store.name;
}

async function runSearch(q, page=1){
  const key = ls.get('apiKey','');
  if(!key){ openSettings(true); return; }
  const chosen = stores.filter(s=>selected.has(s.id));
  if(!chosen.length){ setStatus('Pick at least one store up top'); return; }
  if(page===1){ state = {q, page:1, results:[], filter:'all', perStore:{}, errors:{}, loading:true}; ls.set('lastQ', q); }
  state.loading = true; state.page = page;
  if(page===1){ $('#grid').innerHTML = Array(8).fill('<div class="skel"></div>').join(''); $('#filters').innerHTML=''; $('#below').innerHTML=''; }
  setStatus(`Searching ${chosen.length} store${chosen.length>1?'s':''}…`);

  const lists = await Promise.all(chosen.map(s =>
    searchStore(s, q, page, key).then(r=>({s,r})).catch(e=>({s,r:[],e:e.message||'Failed'}))
  ));
  // interleave so the feed is mixed, not all Aritzia then all Alo
  const fresh=[]; const max=Math.max(0,...lists.map(l=>l.r.length));
  for(let i=0;i<max;i++) lists.forEach(l=>{ if(l.r[i]) fresh.push(l.r[i]); });
  const have = new Set(state.results.map(r=>r.link));
  fresh.forEach(r=>{ if(!have.has(r.link)) state.results.push(r); });
  lists.forEach(l=>{ state.perStore[l.s.id]=(state.perStore[l.s.id]||0)+l.r.length; if(l.e) state.errors[l.s.id]=l.e; });
  state.loading=false;

  const allFailed = lists.every(l=>l.e);
  if(allFailed){ renderFailure(lists[0].e, q, chosen); return; }
  render();
}

function render(){
  const grid=$('#grid');
  const items = state.filter==='all' ? state.results : state.results.filter(r=>r.store===state.filter);
  const errs = Object.keys(state.errors);
  setStatus(`<b>${state.results.length}</b> finds for “${esc(state.q)}”` + (errs.length?` · <span class="err">${errs.map(id=>storeById(id)?.name).join(', ')} didn't load</span>`:''));

  // per-store filter chips
  const f=$('#filters'); f.innerHTML='';
  const mk=(id,label)=>{const b=document.createElement('button');b.className='chip'+(state.filter===id?' on':'');b.textContent=label;b.onclick=()=>{state.filter=id;render();window.scrollTo({top:0,behavior:'smooth'})};f.appendChild(b)};
  mk('all',`All ${state.results.length}`);
  Object.entries(state.perStore).filter(([,n])=>n>0).forEach(([id,n])=>mk(id,`${storeById(id)?.name} ${state.results.filter(r=>r.store===id).length}`));

  if(!items.length){
    grid.innerHTML='';
    $('#below').innerHTML = `<div class="empty">Nothing came back for that one. Try simpler words (like “tube top” instead of “ribbed strapless tube top”).</div>` + fallbackLinks(state.q, stores.filter(s=>selected.has(s.id)));
    return;
  }
  grid.innerHTML = items.map(cardHTML).join('');
  wireCards(grid);
  $('#below').innerHTML = `<button class="more" id="moreBtn">Load more</button>
    <details style="margin-top:18px;color:var(--dim);font-size:14px"><summary>Open the stores' own search pages</summary>${fallbackLinks(state.q, stores.filter(s=>selected.has(s.id)))}</details>`;
  $('#moreBtn').onclick=e=>{e.target.textContent='Loading…';runSearch(state.q, state.page+1)};
}

function cardHTML(r){
  const s=storeById(r.store)||{name:r.store};
  const isFav = favs.some(f=>f.link===r.link);
  return `<a class="card" href="${attr(r.link)}" target="_blank" rel="noopener">
    <img loading="lazy" src="${attr(r.img)}" data-thumb="${attr(r.thumb||'')}" alt="">
    <span class="badge">${esc(s.name)}</span>
    <button class="heart${isFav?' on':''}" data-link="${attr(r.link)}">${HEART}</button>
    <div class="meta2">${esc(r.title)}</div>
    <span class="open">${ARROW}</span>
  </a>`;
}
function wireCards(root){
  root.querySelectorAll('img').forEach(img=>{
    img.onerror=()=>{ const t=img.dataset.thumb; if(t && img.src!==t){img.src=t}else{img.closest('.card').remove()} };
  });
  root.querySelectorAll('.heart').forEach(h=>h.onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    const link=h.dataset.link; const i=favs.findIndex(f=>f.link===link);
    if(i>=0){favs.splice(i,1);h.classList.remove('on')}
    else{const r=state.results.find(x=>x.link===link)||favs.find(x=>x.link===link); if(r){favs.unshift(r);h.classList.add('on')}}
    save();
  });
}

function fallbackLinks(q, list){
  return `<div class="fallback">${list.map(s=>`<a href="${attr(s.url+encodeURIComponent(q))}" target="_blank" rel="noopener">${esc(s.name)} <span>open ↗</span></a>`).join('')}</div>`;
}
function renderFailure(msg, q, chosen){
  $('#grid').innerHTML=''; $('#filters').innerHTML='';
  setStatus(`<span class="err">${esc(msg)}</span>`);
  $('#below').innerHTML = `<div class="empty"><b>Couldn't load the photo feed.</b><br>${msg.includes('key')?'Double check your key in settings (⚙︎).':msg.includes('credits')?'Your free searches might be used up.':'Could be your connection.'}<br>Meanwhile, here are those stores' own search pages:</div>` + fallbackLinks(q, chosen);
}

function setStatus(h){ $('#status').innerHTML=h; }
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s)}

// ---------- saved ----------
function showFavs(){
  state.filter='all';
  setStatus(`<b>${favs.length}</b> saved`);
  $('#filters').innerHTML='';
  const grid=$('#grid');
  if(!favs.length){ grid.innerHTML=''; $('#below').innerHTML='<div class="empty">Tap the ♡ on anything to save it here.</div>'; return; }
  grid.innerHTML=favs.map(cardHTML).join(''); wireCards(grid);
  $('#below').innerHTML='';
}

// ---------- settings ----------
function openSettings(needKey){
  const key = ls.get('apiKey','');
  $('#sheetbox').innerHTML = `
    <h2>${needKey?'One time setup':'Settings'}</h2>
    <p>The photo feed runs on a free <b>Serper</b> key (Google results, limited to each store's site).
    Sign up at <a href="https://serper.dev" target="_blank" rel="noopener">serper.dev</a>, no card needed, copy the API key from your dashboard and paste it here. It's only saved on this phone.</p>
    <div class="row"><input type="text" id="keyIn" placeholder="paste API key" value="${attr(key)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="row"><button class="btn primary" id="saveKey">Save</button><button class="btn" id="closeS">Close</button></div>
    <p style="font-size:12px">Each store you search uses 1 free credit, so 11 stores = 11 credits. Repeat searches in the same session are free (cached).</p>
    <hr>
    <h2>Stores</h2>
    <div class="storelist">${stores.map(s=>`<div class="storeitem">${esc(s.name)}<small>${esc(s.domain)}</small><button class="x" data-del="${s.id}">✕</button></div>`).join('')}</div>
    <p style="margin-bottom:6px">Add a store (name + website, like <i>Edikted</i> + <i>edikted.com</i>)</p>
    <div class="row"><input type="text" id="newName" placeholder="Store name"><input type="text" id="newDom" placeholder="site.com" autocapitalize="off"></div>
    <div class="row"><button class="btn" id="addStore">Add store</button><button class="btn" id="resetStores">Reset to default</button></div>
  `;
  $('#sheet').classList.add('open');
  $('#saveKey').onclick=()=>{ ls.set('apiKey',$('#keyIn').value.trim()); closeSheet(); const q=$('#q').value.trim(); if(q) runSearch(q); };
  $('#closeS').onclick=closeSheet;
  $('#sheetbox').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ stores=stores.filter(s=>s.id!==b.dataset.del); selected.delete(b.dataset.del); save(); renderStoreBar(); openSettings(); });
  $('#addStore').onclick=()=>{
    const name=$('#newName').value.trim(); let dom=$('#newDom').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
    if(!name||!dom) return;
    const id='s'+Date.now();
    stores.push({id,name,domain:dom,url:`https://www.google.com/search?q=site%3A${dom}+`}); selected.add(id); save(); renderStoreBar(); openSettings();
  };
  $('#resetStores').onclick=()=>{ stores=DEFAULT_STORES.slice(); selected=new Set(stores.map(s=>s.id)); save(); renderStoreBar(); openSettings(); };
}
function closeSheet(){ $('#sheet').classList.remove('open'); }
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };

// ---------- wire up ----------
$('#f').onsubmit=e=>{ e.preventDefault(); const q=$('#q').value.trim(); if(q){ $('#q').blur(); runSearch(q); } };
$('#setBtn').onclick=()=>openSettings(false);
$('#favBtn').onclick=showFavs;
renderStoreBar();
const lastQ = ls.get('lastQ','');
if(lastQ) $('#q').value=lastQ;
if(!ls.get('apiKey','')) setStatus('Tap the gear to add your search key first');
else setStatus('Pick your stores, then search');
$('#below').innerHTML = `<div class="hero"><div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></div>
  <h1>Every store, <span>one scroll.</span></h1>
  <p>Check the stores you want up top, search once, and tap anything to go straight to it.</p>
  <div class="tips">${['white tube top','black leggings','linen pants','zip up hoodie'].map(t=>`<button data-try="${t}">${t}</button>`).join('')}</div>
  <div class="hint">On iPhone: Share → Add to Home Screen</div></div>`;
document.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{ $('#q').value=b.dataset.try; runSearch(b.dataset.try); });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
